# VC firm registry for Insights > VC firms -- the only file to edit to add or
# remove a firm. Probed on 2026-09-28 (plain HTTP, and Firecrawl map for sites
# that block it).
#
# site: the firm's OWN website news, read one way, cheapest first:
#   rss      the firm's feed                                              free
#   html     its news page over plain HTTP; post links picked by
#            `link_pattern` (a regex on the URL) when given               free
#   sitemap  its sitemap, filtered by `link_pattern`, newest first        free
#   scrape   Firecrawl scrape of the news page (403 / JavaScript-only)    1 credit
#   map      Firecrawl list of the site's pages, filtered by
#            `link_pattern` -- for posts with no listing page            1 credit
#   `note` records why a firm is read the way it is. `site: null` with
#   `no_site` says why there is no site news to read.
#
# search: optional Firecrawl news search query (~2 credits) -- news ABOUT the
#   firm's deals from other outlets, on top of its own site.
#
# Firecrawl reads run at most every `vc_firecrawl_hours` (config.py).
#
# aliases: regexes (case-insensitive) matched against the investors named in
# funding rounds from the news feed, so deals reported by the press show under
# the firm too. Free.

firms:

- key: antler-india
  label: Antler India
  home: https://www.antler.co/location/india
  site:
    via: sitemap
    url: https://www.antler.co/sitemap.xml
    link_pattern: /press-releases/.
    note: newsroom is JavaScript-rendered; the sitemap lists every press release
  search: '"Antler" India startup funding'
  aliases:
  - \bantler\b

