# Source registry -- the only file to edit to add or remove a source.
# Every entry was verified by scripts/discover_feeds.py on 2026-09-23.
#
# strategy:
#   rss    -> free. feedparser reads feed_url on the 12h schedule.
#   scrape -> costs ~$0.0024/run. ScrapeGraphAI extracts the listing page.
#
# live_search: how the Intelligence section reaches this source in real time.
# All three kinds are free -- no model call. Placeholders: {q} is the
# URL-encoded query, {slug} the query as a hyphenated tag slug.
#   search_feed -> targeted RSS of search results. Best case.
#   feed_refetch-> re-pull the feed and keep items matching the question.
#   search_html -> the site's own search page, parsed as result cards.
#
# Live-search URLs re-verified on 2026-09-24 against each site's robots.txt
# (Python's robotparser ignores wildcards, so these were read by hand).

sources:
  - name: indianstartupnews
    label: Indian Startup News
    home: https://indianstartupnews.com/
    strategy: rss
    feed_url: https://indianstartupnews.com/rss
    feed_depth: 50          # items returned -- deep enough for 12h cadence
    live_search:
      kind: search_html   # server-rendered; ?q= 404s, the form field is title
      url: "https://indianstartupnews.com/search?title={q}"

  - name: entrackr
    label: Entrackr
    home: https://entrackr.com/
    strategy: rss
    feed_url: https://entrackr.com/rss
    feed_depth: 50
    live_search:
      kind: search_html   # same CMS as Indian Startup News; ?s= is ignored
      url: "https://entrackr.com/search?title={q}"

  - name: inc42
    label: Inc42
    home: https://inc42.com/
    strategy: rss
    feed_url: https://inc42.com/feed/
    feed_depth: 24
    live_search:
      # ?s={q}&feed=rss2 does return a filtered feed, but robots.txt has
      # "Disallow: /*?*" for every agent, so we re-pull the main feed instead.
      kind: feed_refetch
      url: https://inc42.com/feed/

  - name: yourstory
    label: YourStory
    home: https://yourstory.com/
    strategy: rss
    feed_url: https://yourstory.com/feed
    feed_depth: 20
    live_search:
      kind: feed_refetch  # ?s= is ignored, and robots.txt disallows /search
      url: https://yourstory.com/feed

  - name: sujatachronicle
    label: Sujata Chronicle
    home: https://sujatachronicle.com/
    strategy: rss         # /feed 404s but /feed.xml is declared in <head>
    feed_url: https://sujatachronicle.com/feed.xml
    feed_depth: 20
    live_search:
      kind: feed_refetch
      url: https://sujatachronicle.com/feed.xml

  - name: vccircle
    label: VCCircle
    home: https://www.vccircle.com/
    strategy: scrape      # the ONLY paid source. No RSS exists anywhere.
    listing_url: https://www.vccircle.com/
    live_search:
      # /search is rendered client-side (the HTML carries no results), but
      # tag pages are server-rendered and exist for most companies.
      kind: search_html
      url: "https://www.vccircle.com/tag/{slug}"

# --- Excluded, with reasons -------------------------------------------------
excluded:
  - name: moneycontrol
    reason: >
      RSS abandoned. Every feed (/rss/latestnews.xml, technology, business,
      economy, buzzingstocks) is frozen at Apr 2024; /rss/startups.xml returns
      503. Content is markets/stocks, not startup ecosystem. Poor topical fit
      and would need scraping a bot-protected site for news we do not want.
  - name: aiboomi
    reason: >
      aiboomi.org/feed/ is a valid RSS feed with ZERO items. It is a
      community/events organisation (SaaSBoomi lineage), not a news publisher.
